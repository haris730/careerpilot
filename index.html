$('bX').onclick=$('bX2').onclick=()=>window.print();

$('v-home').innerHTML='<div class="card pad"><h2 style="margin:0 0 6px">Build Your Career. One Smart CV at a Time.</h2><p class="hint">Welcome back, <b data-n></b>. Your CV is saved automatically in this browser.</p><div class="row"><button class="pri" data-v="cv">Continue editing</button><button data-v="design">Design</button></div></div>';
$('v-profile').innerHTML='<div class="card pad"><h2 style="margin:0" data-n></h2><p class="hint">Free Plan</p><div class="row"><button data-soon="1" class="pri">Upgrade</button></div><div class="row" style="margin-top:8px"><button id="pLoad">Load saved CV</button><button id="pSave">Save CV</button></div><div class="row" style="margin-top:8px"><button id="pX">Export PDF</button></div></div>';
$('pSave').onclick=()=>$('bS').click();$('pX').onclick=()=>window.print();
$('pLoad').onclick=()=>{const r=ls(KEY);if(!r){toast('No saved CV found');return}try{S=norm(JSON.parse(r));sel=null;refresh();toast('CV loaded')}catch(e){toast('Could not load')}};

/* ---------- global jobs + saved CV views ---------- */
const JOBS=[
 ['LinkedIn Jobs','Millions of jobs and people hiring.','https://www.linkedin.com/jobs/','Worldwide'],
 ['Indeed','Global job search with keyword and location search.','https://www.indeed.com/','Worldwide'],
 ['Glassdoor Jobs','Jobs plus company and workplace information.','https://www.glassdoor.com/Job/','Worldwide'],
 ['EURES','Official European job portal and mobility services.','https://eures.europa.eu/','Europe'],
 ['Jobs.com.pk','Pakistan-focused jobs portal.','https://www.jobs.com.pk/','Pakistan']
];
$('v-jobs').innerHTML='<div class="card pad"><div class="ey" style="margin-bottom:5px">GLOBAL JOB SEARCH</div><h2 style="margin:0 0 6px">Find your next opportunity</h2><p class="hint">CareerPilot connects you to established job platforms. Job listings and applications remain on the original provider website.</p><div class="row"><input id="jobQ" placeholder="Job title, skill or keyword" style="margin:0"><input id="jobLoc" placeholder="Country or Remote" style="margin:0"></div></div><div id="jobCards"></div>';
function renderJobs(){
  const q=($('jobQ')?.value||'').toLowerCase(),loc=($('jobLoc')?.value||'').toLowerCase();
  const rows=JOBS.filter(x=>(!q||x[0].toLowerCase().includes(q)||x[1].toLowerCase().includes(q)||x[3].toLowerCase().includes(q))&&(!loc||x[3].toLowerCase().includes(loc)||x[1].toLowerCase().includes(loc)));
  $('jobCards').innerHTML=rows.map(x=>'<div class="card pad" style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><div class="ey">'+x[3].toUpperCase()+'</div><h3 style="margin:3px 0 5px">'+x[0]+'</h3><div class="hint">'+x[1]+'</div></div><a href="'+x[2]+'" target="_blank" rel="noopener noreferrer" style="text-decoration:none"><button class="pri">Open Jobs ↗</button></a></div></div>').join('')||'<div class="card pad"><div class="hint">No matching source found. Try another keyword or country.</div></div>';
}
$('v-jobs').addEventListener('input',renderJobs);renderJobs();

$('v-cvs').innerHTML='<div class="card pad"><div class="ey">MY CVs</div><h2 style="margin:4px 0">Saved on this device</h2><p class="hint">Your current CV is stored locally in this browser. Cloud account sync will be added in a later phase.</p><div class="card pad" style="background:rgba(0,0,0,.18);box-shadow:none"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div><b data-n></b><div class="hint" data-t="title"></div></div><span class="st">✓ Local save</span></div><div class="row" style="margin-top:10px"><button class="pri" data-v="cv">Edit CV</button><button id="cvsExport">Export PDF</button></div></div></div>';
$('cvsExport').onclick=()=>window.print();

/* ---------- editor cards ---------- */
const card=(t,b,o)=>`<details class="card"${o?' open':''}><summary>${t}</summary><div class="cb">${b}</div></details>`;
$('v-cv').innerHTML=card('Personal information',F.map(([p,l,ic])=>`<label>${l}<div class="fw"><i>${ic}</i><input data-p="${p}"${p==='email'?' type="email" aria-invalid="false"':''}></div></label>`).join(''),1)+
card('Summary','<label>Professional summary<textarea rows="5" data-p="summary"></textarea></label>')+
card('Skills','<div class="chips" id="chips"></div><div class="row"><input id="skIn" placeholder="New skill" aria-label="New skill" style="margin:0"><button id="skAdd" style="flex:0 0 auto">+ Add Skill</button></div><label>Languages (one per line)<textarea rows="3" data-p="languages"></textarea></label>')+
card('Experience','<div id="expL"></div><button data-add="exp" style="width:100%">+ Add Experience</button>')+
card('Education','<div id="eduL"></div><button data-add="edu" style="width:100%">+ Add Education</button>')+
card('Achievements','<label>One per line<textarea rows="3" data-p="achievements"></textarea></label>')+
card('Certifications','<label>One per line<textarea rows="3" data-p="certs"></textarea></label>')+
card('Projects','<label>One per line<textarea rows="3" data-p="projects"></textarea></label>');
function txt(){Q('#ed [data-t]').forEach(e=>e.textContent=get(e.dataset.t)||'—');Q('[data-n]').forEach(e=>e.textContent=S.d.name);Q('[data-t="title"]').forEach(e=>e.textContent=S.d.title||'—')}
function chips(){$('chips').innerHTML=S.d.skills.map((s,i)=>`<span class="chip" draggable="true" data-i="${i}"><b aria-hidden="true">⋮⋮</b>${esc(s)}<button data-sk="${i}" aria-label="Remove ${esc(s)}">×</button></span>`).join('')}
function fillSide(){Q('#ed [data-p]').forEach(i=>{if(i===document.activeElement)return;const v=get(i.dataset.p);i.value=Array.isArray(v)?v.join('\n'):v==null?'':v});txt();chips()}
function dyn(open){
  const bt='<span class="bt"><button data-a="ed">Edit</button><button data-a="dup">Duplicate</button><button data-a="del" class="dg">Delete</button></span>';
  const fl=(k,i,fs)=>fs.map(([f,l])=>`<label>${l}<input data-p="${k}.${i}.${f}"></label>`).join('');
  const head=(k,i,n)=>`<div class="ch"><span class="ey">${n} ${String(i+1).padStart(2,'0')}</span>${bt}</div>`;
  $('expL').innerHTML=S.d.exp.map((x,i)=>`<div class="tl" data-k="exp.${i}">${head('exp',i,'EXPERIENCE')}<b data-t="exp.${i}.position"></b><div data-t="exp.${i}.company"></div><small><span data-t="exp.${i}.start"></span> — <span data-t="exp.${i}.end"></span> · <span data-t="exp.${i}.location"></span></small><div class="fs">${fl('exp',i,XF)}<label>Description<textarea rows="4" data-p="exp.${i}.description"></textarea></label></div></div>`).join('');
  $('eduL').innerHTML=S.d.edu.map((x,i)=>`<div class="tl" data-k="edu.${i}">${head('edu',i,'EDUCATION')}<b data-t="edu.${i}.degree"></b><div data-t="edu.${i}.institute"></div><small><span data-t="edu.${i}.year"></span> · <span data-t="edu.${i}.location"></span></small><div class="fs">${fl('edu',i,DF)}</div></div>`).join('');
  if(open){const t=document.querySelector(`.tl[data-k="${open}"]`);if(t)t.classList.add('open')}
  fillSide();
}
function remap(k,f){const n={},re=new RegExp('^cv-'+k+'-(\\d+)-(.*)$');for(const x in S.st){const m=x.match(re);if(!m){n[x]=S.st[x];continue}const i=f(+m[1]);if(i>=0)n[`cv-${k}-${i}-${m[2]}`]=S.st[x]}S.st=n}
const BLANK={exp:()=>({position:'New Position',company:'Company',start:'2024',end:'Present',location:'Location',description:'Describe your responsibilities and achievements.'}),edu:()=>({degree:'Degree / Qualification',institute:'Institute',year:'Year',location:'Location'})};
$('ed').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const tl=b.closest('.tl'),a=b.dataset.a;
  if(tl&&a){const[k,i]=tl.dataset.k.split('.'),n=+i,arr=S.d[k];
    if(a==='ed')tl.classList.toggle('open');
    if(a==='dup'){arr.splice(n+1,0,Object.assign({},arr[n]));remap(k,j=>j>n?j+1:j);dyn(`${k}.${n+1}`);render();sync()}
    if(a==='del'){arr.splice(n,1);remap(k,j=>j===n?-1:j>n?j-1:j);dyn();render();sync()}}
  if(b.dataset.add){const k=b.dataset.add;S.d[k].push(BLANK[k]());dyn(k+'.'+(S.d[k].length-1));render();sync()}
  if(b.dataset.sk!=null){S.d.skills.splice(+b.dataset.sk,1);chips();render();sync()}
  if(b.id==='skAdd')addSkill();
});
function addSkill(){const i=$('skIn'),v=i.value.trim();if(!v)return;S.d.skills.push(v);i.value='';chips();render();sync()}
$('skIn').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addSkill()}});
let dg=null;const ch=$('chips');
ch.addEventListener('dragstart',e=>{const c=e.target.closest('.chip');if(c){dg=+c.dataset.i;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(dg))}});
ch.addEventListener('dragover',e=>e.preventDefault());
ch.addEventListener('drop',e=>{e.preventDefault();const c=e.target.closest('.chip');if(!c||dg==null)return;const a=S.d.skills,m=a.splice(dg,1)[0];a.splice(+c.dataset.i,0,m);dg=null;chips();render();sync()});
$('ed').addEventListener('input',e=>{
  const t=e.target,p=t.dataset&&t.dataset.p;if(!p)return;let v=t.value;
  if(LISTS.includes(p))v=v.split('\n').filter(s=>s.trim());
  set(p,v);
  if(p==='email'){const ok=/^\S+@\S+\.\S+$/.test(v);t.classList.toggle('ok',ok&&!!v);t.classList.toggle('bad',!ok&&!!v);t.setAttribute('aria-invalid',String(!ok&&!!v))}
  txt();render();sync();
});

/* ---------- design panel ---------- */
const LAY=[['1','One Column'],['2','Two Column'],['s','Sidebar']],RG=[['mg','Margins',20,60],['sp','Section spacing',8,36],['cw','Column width',180,320],['gp','Column gap',0,40]];
$('v-design').innerHTML=`<div class="tabs" role="tablist">${['Templates','Colors','Typography','Layout'].map((t,i)=>`<button role="tab" data-dt="${i}" class="${i?'':'on'}">${t}</button>`).join('')}</div>
<div class="dp on card pad"><div class="car">${TPL.map(([n,p],i)=>`<button class="tc" data-tp="${i}"><div class="th ${p.lay}" style="--c:${p.ac}"><i></i><s></s><s></s></div>${n}</button>`).join('')}</div></div>
<div class="dp card pad"><div class="sw">${COL.map(([n,c])=>`<button class="sc" data-col="${c}"><i style="background:${c}"></i>${n}</button>`).join('')}</div><label>Custom accent color<input type="color" id="tAc"></label><label>CV background<select id="tBg"></select></label></div>
<div class="dp card pad"><label>Template font<select id="tFf"></select></label><p class="hint">Select any text in the CV to change its font, size, weight, letter spacing and line height. Only that element changes.</p></div>
<div class="dp card pad"><div class="row">${LAY.map(([v,l])=>`<button class="lb" data-lay="${v}">${l}</button>`).join('')}</div>${RG.map(([k,l,a,b])=>`<label>${l}<input type="range" data-l="${k}" min="${a}" max="${b}"></label>`).join('')}</div>`;
FONTS.forEach(([v,l])=>{$('sFont').add(new Option(l,v));if(v)$('tFf').add(new Option(l,v))});
BGS.forEach(([v,l])=>$('tBg').add(new Option(l,v)));
$('v-design').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.dt!=null){Q('[data-dt]').forEach(x=>x.classList.toggle('on',x===b));Q('#v-design .dp').forEach((x,i)=>x.classList.toggle('on',i===+b.dataset.dt))}
  if(b.dataset.tp!=null){Object.assign(S.t,TPL[+b.dataset.tp][1]);applyT();sync()}
  if(b.dataset.col){S.t.ac=b.dataset.col;applyT();sync()}
  if(b.dataset.lay){S.t.lay=b.dataset.lay;applyT();sync()}
});
$('v-design').addEventListener('input',e=>{const t=e.target;if(t.id==='tAc')S.t.ac=t.value;else if(t.dataset.l)S.t[t.dataset.l]=+t.value;else return;applyT();sync()});
$('v-design').addEventListener('change',e=>{const t=e.target;if(t.id==='tBg')S.t.bg=t.value;else if(t.id==='tFf')S.t.ff=t.value;else return;applyT();sync()});
function applyT(){
  const t=S.t,s=paper.style;paper.className='L'+t.lay+' T-'+t.tpl;
  s.setProperty('--ac',t.ac);s.setProperty('--mg',t.mg+'px');s.setProperty('--sp',t.sp+'px');s.setProperty('--cw',t.cw+'px');s.setProperty('--gp',t.gp+'px');s.background=t.bg;s.fontFamily=t.ff;
  $('tAc').value=t.ac;$('tBg').value=t.bg;$('tFf').value=t.ff;Q('[data-l]').forEach(r=>r.value=t[r.dataset.l]);
  Q('[data-tp]').forEach((b,i)=>b.classList.toggle('on',TPL[i][1].tpl===t.tpl));Q('[data-lay]').forEach(b=>b.classList.toggle('on',b.dataset.lay===t.lay));Q('[data-col]').forEach(b=>b.classList.toggle('on',b.dataset.col===t.ac));fit();
}

/* ---------- CV canvas ---------- */
const E=(id,p,t,c,ph,m)=>`<div id="${id}" class="el ${c}" data-p="${p}" data-ph="${ph}"${m?' data-m="1"':''} contenteditable="true" spellcheck="false">${esc(t)}</div>`;
const Hd=(k,t)=>`<h3><span id="cv-${k}-heading" class="el">${t}</span></h3>`;
function render(){
  const d=S.d;
  const list=(k,h,key,c)=>d[k].length?`<section>${Hd(key,h)}${d[k].map((x,i)=>E(`cv-${key}-${i}`,`${k}.${i}`,x,c,'Item')).join('')}</section>`:'';
  const exp=d.exp.length?`<section>${Hd('experience','Experience')}${d.exp.map((x,i)=>{const q=f=>`exp.${i}.${f}`,id=f=>`cv-exp-${i}-${f}`;
    return `<div class="it"><div class="row">${E(id('position'),q('position'),x.position,'pos','Job title')}<div class="dt">${E(id('start'),q('start'),x.start,'','Start')}<span>–</span>${E(id('end'),q('end'),x.end,'','End')}</div></div><div class="row">${E(id('company'),q('company'),x.company,'co','Company')}${E(id('location'),q('location'),x.location,'mt','Location')}</div>${E(id('description'),q('description'),x.description,'','Description',1)}</div>`}).join('')}</section>`:'';
  const edu=d.edu.length?`<section>${Hd('education','Education')}${d.edu.map((x,i)=>{const q=f=>`edu.${i}.${f}`,id=f=>`cv-edu-${i}-${f}`;
    return `<div class="it">${E(id('degree'),q('degree'),x.degree,'pos','Degree')}${E(id('school'),q('institute'),x.institute,'co','Institute')}<div class="row mt">${E(id('year'),q('year'),x.year,'','Year')}${E(id('location'),q('location'),x.location,'','Location')}</div></div>`}).join('')}</section>`:'';
  paper.innerHTML=`<div class="hd">${E('cv-name','name',d.name,'nm','Full name')}${E('cv-title','title',d.title,'tt','Professional title')}<div class="ct">${E('cv-email','email',d.email,'','Email')}${E('cv-phone','phone',d.phone,'','Phone')}${E('cv-location','location',d.location,'','Location')}${E('cv-portfolio','link',d.link,'','Portfolio / LinkedIn')}</div></div>
<div class="bd"><div class="lc">${list('skills','Skills','skills','li').replace(/cv-skills-(\d)/g,'cv-skill-$1')}${list('languages','Languages','languages','li')}${edu}${list('certs','Certifications','certs','li')}</div>
<div class="rc"><section>${Hd('summary','Professional Summary')}${E('cv-summary','summary',d.summary,'','Write a short summary',1)}</section>${exp}${list('achievements','Achievements','achievements','bl')}${list('projects','Projects','projects','bl')}</div></div>`;
  Q('.el',paper).forEach(applyStyle);
  const e=sel&&$(sel);if(e)e.classList.add('sel');else if(sel){sel=null;loadPanel()}
  fit();
}
function applyStyle(el){
  const s=S.st[el.id];el.style.cssText='';if(!s)return;
  if(s.c)el.style.color=s.c;if(s.z)el.style.fontSize=s.z+'px';if(s.f)el.style.fontFamily=s.f;if(s.w)el.style.fontWeight=s.w;if(s.a)el.style.textAlign=s.a;
  if(s.ls)el.style.letterSpacing=s.ls+'px';if(s.lh)el.style.lineHeight=s.lh;
  if(s.x||s.y){el.style.position='relative';el.style.left=(s.x||0)+'px';el.style.top=(s.y||0)+'px'}
}
function fit(){const w=$('stage').clientWidth-32;if(w<=0)return;cz=Z||Math.min(1,w/794);paper.style.transform=`scale(${cz})`;$('fit').style.width=794*cz+'px';$('fit').style.height=paper.offsetHeight*cz+'px';$('zv').textContent=Math.round(cz*100)+'%'}
$('zm').onclick=()=>{Z=Math.max(.3,+(cz-.1).toFixed(2));fit()};$('zp').onclick=()=>{Z=Math.min(2,+(cz+.1).toFixed(2));fit()};$('zf').onclick=()=>{Z=null;fit()};
window.addEventListener('resize',fit);if(window.ResizeObserver)new ResizeObserver(fit).observe(paper);

/* ---------- selected element (styles keyed by unique element id) ---------- */
const NM={'cv-name':'Full Name','cv-title':'Professional Title','cv-email':'Email','cv-phone':'Phone','cv-location':'Location','cv-portfolio':'Portfolio / LinkedIn','cv-summary':'Summary'};
const label=id=>NM[id]||id.replace('cv-','').replace(/-/g,' ').replace(/^./,c=>c.toUpperCase());
const sColor=$('sColor'),sSize=$('sSize'),sFont=$('sFont'),sBold=$('sBold'),sX=$('sX'),sY=$('sY'),sLs=$('sLs'),sLh=$('sLh');
function loadPanel(){
  const el=sel&&$(sel);$('esel').classList.toggle('on',!!el);
  if(!el){sel=null;return}
  const cs=getComputedStyle(el),s=S.st[sel]||{};
  $('sn').textContent=label(sel);sColor.value=hex(cs.color);sSize.value=Math.round(parseFloat(cs.fontSize));sFont.value=s.f||'';
  const b=+cs.fontWeight>=600;sBold.setAttribute('aria-pressed',b);sBold.classList.toggle('pri',b);
  sX.value=s.x||0;sY.value=s.y||0;sLs.value=s.ls||0;sLh.value=s.lh||Math.round(parseFloat(cs.lineHeight)/parseFloat(cs.fontSize)*10)/10||1.4;
  const a=cs.textAlign==='center'||cs.textAlign==='right'?cs.textAlign:'left';Q('#sAlign button').forEach(x=>x.classList.toggle('on',x.dataset.a===a));
}
function select(id){Q('.el.sel').forEach(x=>x.classList.remove('sel'));sel=id;$(id).classList.add('sel');loadPanel()}
function setSt(k,v){if(!sel)return;(S.st[sel]=S.st[sel]||{})[k]=v;applyStyle($(sel));sync()}
paper.addEventListener('click',e=>{const el=e.target.closest('.el');if(el&&el.id&&el.id!==sel)select(el.id)});
paper.addEventListener('input',e=>{const el=e.target.closest('.el');if(!el||!el.dataset.p)return;set(el.dataset.p,el.innerText.replace(/\n$/,''));fillSide();fit();sync()});
paper.addEventListener('keydown',e=>{const el=e.target.closest('.el');if(el&&e.key==='Enter'&&!el.dataset.m){e.preventDefault();el.blur()}});
paper.addEventListener('paste',e=>{e.preventDefault();document.execCommand('insertText',false,(e.clipboardData||window.clipboardData).getData('text/plain'))});
sColor.oninput=()=>setSt('c',sColor.value);sSize.oninput=()=>setSt('z',+sSize.value||0);sFont.onchange=()=>setSt('f',sFont.value);
sBold.onclick=()=>{const b=sBold.getAttribute('aria-pressed')!=='true';sBold.setAttribute('aria-pressed',b);sBold.classList.toggle('pri',b);setSt('w',b?'700':'400')};
sX.oninput=()=>setSt('x',+sX.value||0);sY.oninput=()=>setSt('y',+sY.value||0);sLs.oninput=()=>setSt('ls',+sLs.value||0);sLh.oninput=()=>setSt('lh',+sLh.value||0);
$('sAlign').onclick=e=>{const b=e.target.closest('button');if(b){setSt('a',b.dataset.a);loadPanel()}};
$('sReset').onclick=()=>{if(!sel)return;delete S.st[sel];applyStyle($(sel));loadPanel();sync()};
$('sx').onclick=()=>{Q('.el.sel').forEach(x=>x.classList.remove('sel'));sel=null;loadPanel()};

function refresh(){dyn();applyT();render();loadPanel();go(document.body.dataset.v)}
refresh();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
})();
</script>
</body>
</html>
