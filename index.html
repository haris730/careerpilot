function cvMatch(j){
  const d=S?.d||{};
  const cvText=[d.name,d.title,d.summary,(d.skills||[]).join(' '),(d.languages||[]).join(' '),(d.certs||[]).join(' '),(d.projects||[]).join(' '),...(d.exp||[]).flatMap(x=>[x.position,x.company,x.description]),...(d.edu||[]).flatMap(x=>[x.degree,x.institute,x.year])].filter(Boolean).join(' ');
  const cvWords=new Set(toolWords(cvText));
  const jobText=[j.title,j.category,j.job_type,j.company_name,j.candidate_required_location].flat().filter(Boolean).join(' ');
  const words=toolWords(jobText);
  const stop=new Set(['senior','junior','lead','remote','full','time','part','contract','freelance','developer','engineer','specialist','manager','assistant','associate','the','and','for','with','from','worldwide','usa','canada','united','states','global']);
  const useful=[...new Set(words.filter(w=>w.length>2&&!stop.has(w)))];
  const matched=useful.filter(w=>cvWords.has(w));
  const missing=useful.filter(w=>!cvWords.has(w)).slice(0,6);
  const titleWords=toolWords(j.title||'').filter(w=>!stop.has(w));
  const titleHits=titleWords.filter(w=>cvWords.has(w)).length;
  const skillHits=matched.length;
  const score=useful.length?Math.min(98,Math.max(8,Math.round(35+(skillHits/useful.length)*55+(titleHits?10:0)))):35;
  return {score,matched:matched.slice(0,8),missing};
}

function jobSalaryMax(j){
  const s=String(j.salary||'').replace(/,/g,'');
  const nums=[...s.matchAll(/(?:\\$|€|£)?\\s*(\\d+(?:\\.\\d+)?)\\s*([kKmM])?/g)].map(m=>{let n=Number(m[1]);if((m[2]||'').toLowerCase()==='k')n*=1000;if((m[2]||'').toLowerCase()==='m')n*=1000000;return n});
  return nums.length?Math.max(...nums):0;
}
function jobExperience(j){
  const t=String(j.title||'').toLowerCase();
  if(/senior|sr\\.?|lead|principal|staff|manager|director|head|architect/.test(t))return 'senior';
  if(/junior|jr\\.?|entry|intern|trainee|graduate/.test(t))return 'entry';
  return 'mid';
}

async function loadLiveJobs(){
  const q=($('jobQ')?.value||'').trim(),loc=($('jobLoc')?.value||'').trim(),type=$('jobType')?.value||'',exp=$('jobExp')?.value||'',salary=Number($('jobSalary')?.value||0),sort=$('jobSort')?.value||'recent';
  const status=$('jobStatus'),cards=$('jobCards');if(!status||!cards)return;
  status.textContent='Loading live jobs…';cards.innerHTML='<div class="card pad"><div class="hint">Searching live listings…</div></div>';
  const p=new URLSearchParams();if(q)p.set('search',q);if(type)p.set('type',type);p.set('limit','30');
  try{
    const r=await fetch('/api/jobs?'+p.toString(),{headers:{accept:'application/json'}});
    const data=await r.json();if(!r.ok)throw new Error(data.error||'Job service unavailable');
    let rows=Array.isArray(data.jobs)?data.jobs:[];
    window.__careerPilotLiveJobs=rows;
    const needle=loc.toLowerCase();
    if(needle)rows=rows.filter(j=>jobLocationText(j).toLowerCase().includes(needle)||String(j.title||'').toLowerCase().includes(needle)||String(j.company_name||'').toLowerCase().includes(needle));
    if(exp)rows=rows.filter(j=>jobExperience(j)===exp);
    if(salary)rows=rows.filter(j=>jobSalaryMax(j)>=salary);
    if(sort==='salary')rows.sort((a,b)=>jobSalaryMax(b)-jobSalaryMax(a));
    else if(sort==='match')rows.sort((a,b)=>cvMatch(b).score-cvMatch(a).score);
    else rows.sort((a,b)=>new Date(b.publication_date||0)-new Date(a.publication_date||0));
    cards.innerHTML=rows.length?rows.map(jobCard).join(''):'<div class="card pad"><div class="hint">No live jobs matched these filters. Try broader filters or remove the salary/experience requirement.</div></div>';
    status.textContent=rows.length+' live job'+(rows.length===1?'':'s')+' found · Source: Remotive';
  }catch(e){
    cards.innerHTML='<div class="card pad"><div class="hint">Live job search is temporarily unavailable. You can still use the job portals below.</div></div>';
    status.textContent='Live search unavailable right now.';
  }
}

async function serverAlertRequest(method,body,id){if(!currentUser)return null;const {data}=await sb.auth.getSession(),token=data.session?.access_token;if(!token)return null;const u='/api/job-alerts'+(id?'?id='+encodeURIComponent(id):'');const r=await fetch(u,{method,headers:{accept:'application/json','content-type':'application/json',authorization:'Bearer '+token},body:method==='POST'?JSON.stringify(body):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Server Job Alert unavailable');return d}

function alertMatchesJob(j,a){const q=String(a.q||'').toLowerCase(),loc=String(a.loc||'').toLowerCase(),t=[j.title,j.category,j.company_name,j.job_type,jobLocationText(j)].join(' ').toLowerCase();if(q&&!t.includes(q))return false;if(loc&&!jobLocationText(j).toLowerCase().includes(loc)&&!String(j.title||'').toLowerCase().includes(loc)&&!String(j.company_name||'').toLowerCase().includes(loc))return false;if(a.type&&String(j.job_type||'')!==a.type)return false;if(a.exp&&jobExperience(j)!==a.exp)return false;if(a.salary&&jobSalaryMax(j)<Number(a.salary))return false;return true}

async function checkOneJobAlert(a){if(currentUser){try{const d=await serverAlertRequest('POST',{id:a.id,keyword:a.q,location:a.loc,job_type:a.type,experience:a.exp,min_salary:a.salary,frequency:a.freq});return (d?.alerts||[]).filter(x=>x.id===a.id).map(x=>({job:{},new:x.newCount>0,createdAt:x.checkedAt||Date.now()}))}catch(e){}}const p=new URLSearchParams();if(a.q)p.set('search',a.q);if(a.type)p.set('type',a.type);p.set('limit','30');const r=await fetch('/api/jobs?'+p.toString(),{headers:{accept:'application/json'}}),data=await r.json();if(!r.ok)throw new Error(data.error||'Job service unavailable');const rows=(Array.isArray(data.jobs)?data.jobs:[]).filter(j=>alertMatchesJob(j,a)),seen=new Set(a.seen||[]),fresh=rows.filter(j=>!seen.has(jobKey(j)));a.seen=[...rows.map(jobKey),...(a.seen||[])].slice(0,120);a.lastChecked=Date.now();a.newCount=fresh.length;return fresh.map(j=>({job:j,new:true,createdAt:Date.now()}))}

async function createJobAlert(){const a={id:'alert-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),q:($('alertQ')?.value||'').trim(),loc:($('alertLoc')?.value||'').trim(),type:$('alertType')?.value||'',exp:$('alertExp')?.value||'',salary:Number($('alertSalary')?.value||0),freq:$('alertFreq')?.value||'daily',seen:[],newCount:0,createdAt:Date.now(),server:false};if(!a.q&&!a.loc){toast('Add a job keyword or location');return}const alerts=loadJobAlerts();alerts.unshift(a);saveJobAlerts(alerts);renderJobAlerts();if(currentUser){try{await serverAlertRequest('POST',{id:a.id,keyword:a.q,location:a.loc,job_type:a.type,experience:a.exp,min_salary:a.salary,frequency:a.freq});a.server=true;saveJobAlerts(alerts);toast('✓ Job Alert created — server automatic checks enabled');await syncServerJobAlerts()}catch(e){toast('Alert saved locally; server sync failed')}}else{toast('✓ Job Alert created');await checkJobAlerts([a.id])}}
