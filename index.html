function exportPDF(){
  const source=$('paper');
  if(!source){toast('CV preview is not ready');return}
  const w=window.open('','_blank','width=1100,height=850');
  if(!w){toast('Please allow pop-ups to export PDF');return}

  const styles=[...document.querySelectorAll('style')].map(s=>s.textContent).join('\n');
  const clone=source.cloneNode(true);

  // Keep the CV as real HTML text. Never convert it to canvas/image.
  Q('.el.sel',clone).forEach(x=>x.classList.remove('sel'));
  Q('.el:hover',clone).forEach(x=>x.classList.remove('hover'));
  Q('[contenteditable]',clone).forEach(x=>{
    x.removeAttribute('contenteditable');
    x.removeAttribute('spellcheck');
    x.removeAttribute('tabindex');
  });

  const printCss=`
    @page{size:A4;margin:0}
    *{
      -webkit-print-color-adjust:exact!important;
      print-color-adjust:exact!important;
      text-rendering:auto!important;
      filter:none!important;
      backdrop-filter:none!important;
      -webkit-backdrop-filter:none!important;
      mix-blend-mode:normal!important;
      perspective:none!important;
      will-change:auto!important;
    }
    html,body{
      margin:0!important;padding:0!important;
      width:210mm!important;min-height:297mm!important;
      background:#fff!important;color:#111827!important;
      -webkit-user-select:text!important;user-select:text!important;
    }
    body{display:block!important}
    .pdf-wrap{
      width:210mm!important;min-height:297mm!important;
      margin:0!important;padding:0!important;
      overflow:visible!important;background:#fff!important;
    }
    .pdf-wrap #paper{
      width:210mm!important;min-height:297mm!important;height:auto!important;
      margin:0!important;padding:0!important;
      transform:none!important;zoom:1!important;box-shadow:none!important;
      overflow:visible!important;position:relative!important;isolation:auto!important;
    }
    .pdf-wrap #paper,.pdf-wrap #paper *{
      -webkit-user-select:text!important;user-select:text!important;
    }
    .el{cursor:default!important;outline:none!important;caret-color:transparent!important}
    .it,section,.hd{break-inside:avoid!important;page-break-inside:avoid!important}
    @media print{html,body{width:210mm!important;background:#fff!important}.pdf-wrap{width:210mm!important}}
  `;

  w.document.open();
  w.document.write(
    '<!doctype html><html><head><meta charset="utf-8"><title>CareerPilot CV — '+
    esc(S.d.name||'CV')+
    '</title><style>'+styles+'\n'+printCss+
    '</style></head><body><div class="pdf-wrap">'+
    clone.outerHTML+
    '</div></body></html>'
  );
  w.document.close();

  const print=()=>{w.focus();w.print()};
  if(w.document.fonts&&w.document.fonts.ready){
    w.document.fonts.ready.then(()=>setTimeout(print,500)).catch(()=>setTimeout(print,800));
  }else setTimeout(print,800);
}

 const cvText=normText(cv),jdText=normText(jd);
 const stop=new Set(['the','and','for','with','from','that','this','your','you','are','our','job','work','will','have','has','not','can','all','their','they','who','into','about','using','role','team','company','years','year','what','how','but','these','those','them','then','than','also','more','most','must','able','looking','join','including','required','requirements','responsibilities','skills','experience','position','candidate','please','within','across','based','would','should','may','need','per','via','etc','such','well','good','strong','knowledge','ability','plus']);
 const raw=jdText.split(/\s+/).filter(Boolean);
 const tokens=[...new Set(raw.filter(x=>x.length>=3&&!stop.has(x)&&!/^\d+$/.test(x)))];
 const phrases=[];

 ];

 const responsibilityCoverage=phrases.length?Math.round(phraseKeys.length/Math.max(Math.min(phrases.length,20),1)*100):0;
 const matchScore=Math.min(100,Math.round((keywordScore/50)*55+(responsibilityCoverage/100)*25+(roleMatch===null?50:roleMatch)*.2));

const CVLIB_KEY='careerpilot_cv_library_2026',CVACTIVE_KEY='careerpilot_active_cv_2026';
let cvLibrary=[],activeCvId=null;
function cloneCV(x){return JSON.parse(JSON.stringify(x))}
function cvTime(v){return new Date(v||Date.now()).toLocaleString([], {year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}
function cvAccent(data){return data?.t?.ac||'#2563eb'}
function cvTitle(data){return data?.d?.title||'Professional CV'}
function loadCVLibrary(){
  try{
    const raw=ls(CVLIB_KEY);
    if(raw){const a=JSON.parse(raw);if(Array.isArray(a)&&a.length){cvLibrary=a.map(x=>({id:String(x.id),name:x.name||'My CV',data:norm(x.data||dflt()),updatedAt:x.updatedAt||Date.now(),cloudId:x.cloudId||null}));}}
  }catch(e){}

    const legacy=cloneCV(S);

  }
  try{activeCvId=ls(CVACTIVE_KEY)||cvLibrary[0].id}catch(e){activeCvId=cvLibrary[0].id}
  if(!cvLibrary.some(x=>x.id===activeCvId))activeCvId=cvLibrary[0].id;

}
function saveCVLibrary(){try{localStorage.setItem(CVLIB_KEY,JSON.stringify(cvLibrary));localStorage.setItem(CVACTIVE_KEY,activeCvId||'')}catch(e){}}

}

function createCV(){

  const x={id:'cv-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),name:'Untitled CV',data:d,updatedAt:Date.now(),cloudId:null};

function duplicateCV(id){
  const src=cvLibrary.find(v=>v.id===id)||activeCV();if(!src)return;

function renameCV(id){

  saveCVLibrary();renderCVLibrary();scheduleCloudSave();toast('CV renamed');
}
function deleteCV(id){

/* ---------- CV canvas ---------- */
const E=(id,p,t,c,ph,m)=>`<div id="${id}" class="el ${c}" data-p="${p}" data-ph="${ph}"${m?' data-m="1"':''} contenteditable="true" spellcheck="false">${esc(t)}</div>`;
const Hd=(k,t)=>`<h3><span id="cv-${k}-heading" class="el">${t}</span></h3>`;
function render(){
  const d=S.d;
  const list=(k,h,key,c)=>d[k].length?`<section>${Hd(key,h)}${d[k].map((x,i)=>E(`cv-${key}-${i}`,`${k}.${i}`,x,c,'Item')).join('')}</section>`:'';
  const exp=d.exp.length?`<section>${Hd('experience','Experience')}${d.exp.map((x,i)=>{const q=f=>`exp.${i}.${f}`,id=f=>`cv-exp-${i}-${f}`;
    return `<div class="it"><div class="row">${E(id('position'),q('position'),x.position,'pos','Job title')}<div class="dt">${E(id('start'),q('start'),x.start,'','Start')}<span>–</span>${E(id('end'),q('end'),x.end,'','End')}</div></div><div class="row">${E(id('company'),q('company'),x.company,'co','Company')}${E(id('location'),q('location'),x.location,'mt','Location')}</div>${E(id('description'),q('description'),x.description,'','Description',1)}</div>`}).join('')}</section>`:'';
  const edu=d.edu.length?`<section>${Hd('education','Education')}${d.edu.map((x,i)=>{const q=f=>`edu.${i}.${f}`,id=f=>`cv-edu-${i}-${f}`;
    return `<div class="it">${E(id('degree'),q('degree'),x.degree,'pos','Degree')}${E(id('school'),q('institute'),x.institute,'co','Institute')}<div class="row mt">${E(id('year'),q('year'),x.year,'','Year')}${E(id('location'),q('location'),x.location,'','Location')}</div></div>`}).join('')}</section>`:'';
  paper.innerHTML=`<div class="hd">${E('cv-name','name',d.name,'nm','Full name')}${E('cv-title','title',d.title,'tt','Professional title')}<div class="ct">${E('cv-email','email',d.email,'','Email')}${E('cv-phone','phone',d.phone,'','Phone')}${E('cv-location','location',d.location,'','Location')}${E('cv-portfolio','link',d.link,'','Portfolio / LinkedIn')}</div></div>
<div class="bd"><div class="lc">${list('skills','Skills','skills','li').replace(/cv-skills-(\d)/g,'cv-skill-$1')}${list('languages','Languages','languages','li')}${edu}${list('certs','Certifications','certs','li')}</div>
<div class="rc"><section>${Hd('summary','Professional Summary')}${E('cv-summary','summary',d.summary,'','Write a short summary',1)}</section>${exp}${list('achievements','Achievements','achievements','bl')}${list('projects','Projects','projects','bl')}</div></div>`;
  Q('.el',paper).forEach(applyStyle);
  const e=sel&&$(sel);if(e)e.classList.add('sel');else if(sel){sel=null;loadPanel()}
  fit();
}
function applyStyle(el){
  const s=S.st[el.id];el.style.cssText='';if(!s)return;
  if(s.c)el.style.color=s.c;if(s.z)el.style.fontSize=s.z+'px';if(s.f)el.style.fontFamily=s.f;if(s.w)el.style.fontWeight=s.w;if(s.a)el.style.textAlign=s.a;
  if(s.ls)el.style.letterSpacing=s.ls+'px';if(s.lh)el.style.lineHeight=s.lh;
  if(s.x||s.y){el.style.position='relative';el.style.left=(s.x||0)+'px';el.style.top=(s.y||0)+'px'}
}
function fit(){const w=$('stage').clientWidth-32;if(w<=0)return;cz=Z||Math.min(1,w/794);paper.style.transform=`scale(${cz})`;$('fit').style.width=794*cz+'px';$('fit').style.height=paper.offsetHeight*cz+'px';$('zv').textContent=Math.round(cz*100)+'%'}
$('zm').onclick=()=>{Z=Math.max(.3,+(cz-.1).toFixed(2));fit()};$('zp').onclick=()=>{Z=Math.min(2,+(cz+.1).toFixed(2));fit()};$('zf').onclick=()=>{Z=null;fit()};
window.addEventListener('resize',fit);if(window.ResizeObserver)new ResizeObserver(fit).observe(paper);

const sColor=$('sColor'),sSize=$('sSize'),sFont=$('sFont'),sBold=$('sBold'),sX=$('sX'),sY=$('sY'),sLs=$('sLs'),sLh=$('sLh');
function loadPanel(){
  const el=sel&&$(sel);$('esel').classList.toggle('on',!!el);
  if(!el){sel=null;return}
  const cs=getComputedStyle(el),s=S.st[sel]||{};
  $('sn').textContent=label(sel);sColor.value=hex(cs.color);sSize.value=Math.round(parseFloat(cs.fontSize));sFont.value=s.f||'';
  const b=+cs.fontWeight>=600;sBold.setAttribute('aria-pressed',b);sBold.classList.toggle('pri',b);
  sX.value=s.x||0;sY.value=s.y||0;sLs.value=s.ls||0;sLh.value=s.lh||Math.round(parseFloat(cs.lineHeight)/parseFloat(cs.fontSize)*10)/10||1.4;
  const a=cs.textAlign==='center'||cs.textAlign==='right'?cs.textAlign:'left';Q('#sAlign button').forEach(x=>x.classList.toggle('on',x.dataset.a===a));
}
function select(id){Q('.el.sel').forEach(x=>x.classList.remove('sel'));sel=id;$(id).classList.add('sel');loadPanel()}

sColor.oninput=()=>setSt('c',sColor.value);sSize.oninput=()=>setSt('z',+sSize.value||0);sFont.onchange=()=>setSt('f',sFont.value);
sBold.onclick=()=>{const b=sBold.getAttribute('aria-pressed')!=='true';sBold.setAttribute('aria-pressed',b);sBold.classList.toggle('pri',b);setSt('w',b?'700':'400')};
sX.oninput=()=>setSt('x',+sX.value||0);sY.oninput=()=>setSt('y',+sY.value||0);sLs.oninput=()=>setSt('ls',+sLs.value||0);sLh.oninput=()=>setSt('lh',+sLh.value||0);

async function loadCloud(){
  if(!currentUser)return;
  const {data,error}=await sb.from('cvs').select('id,name,cv_data,template,updated_at').order('updated_at',{ascending:false});
  if(error){toast('Cloud CV load failed');return}
  if(data?.length){
    cvLibrary=data.map(row=>({id:'cloud-'+row.id,cloudId:row.id,name:row.name||row.cv_data?.d?.name||'My CV',data:norm(row.cv_data),updatedAt:row.updated_at||Date.now()}));
    activeCvId=cvLibrary[0].id;S=norm(cloneCV(cvLibrary[0].data));sel=null;saveCVLibrary();localStorage.setItem(KEY,JSON.stringify(S));refresh();renderCVLibrary();toast(data.length+' CV'+(data.length===1?'':'s')+' loaded from cloud');
  }else{
    syncActiveLibrary();await saveCloud();
  }

function scheduleCloudSave(){clearTimeout(cloudTimer);if(currentUser)cloudTimer=setTimeout(()=>saveCloud(),900)}
async function saveCloud(){
  if(!currentUser)return;
  const x=activeCV();if(!x)return;
  x.data=cloneCV(S);x.name=S.d.name||x.name||'My CV';x.updatedAt=Date.now();saveCVLibrary();
  const payload={user_id:currentUser.id,name:x.name,cv_data:x.data,template:x.data.t?.tpl||null,updated_at:new Date().toISOString()};
  let result;
  if(x.cloudId){
    result=await sb.from('cvs').update(payload).eq('id',x.cloudId).eq('user_id',currentUser.id);
  }else{
    result=await sb.from('cvs').insert(payload).select('id').maybeSingle();
