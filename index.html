<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CareerPilot CV Builder</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#172033;font-family:Arial,sans-serif}.app{max-width:1400px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.layout{display:grid;grid-template-columns:340px 1fr;gap:18px}.panel{background:#fff;border:1px solid #dbe3ec;border-radius:14px;padding:18px}label{font-size:12px;font-weight:bold;display:block;margin:10px 0 5px}input,textarea,select{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}textarea{min-height:75px}.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1}.active,button.primary{background:#172033;color:#fff}button{border:0;border-radius:8px;padding:9px 12px;font-weight:bold;cursor:pointer}.secondary{background:#e2e8f0}.danger{background:#fee2e2;color:#991b1b}.canvas{overflow:auto;display:flex;justify-content:center;background:#e2e8f0}.paper{width:794px;min-height:1123px;background:#fff;box-shadow:0 10px 35px #0002;--accent:#334155}.head{padding:48px;border-bottom:4px solid var(--accent)}.name{font-size:36px;font-weight:800;margin:0}.title{font-size:18px;font-weight:600;margin-top:6px}.contact{font-size:12px;color:#64748b;margin-top:9px}.body{display:grid;grid-template-columns:235px 1fr}.side{background:#f8fafc;padding:30px 24px}.main{padding:30px 34px}.sec{margin-bottom:24px}.sec h2{font-size:14px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);margin:0 0 9px}.txt{font-size:13px;line-height:1.55;white-space:pre-line}.skill{font-size:12px;padding:7px;border-left:3px solid var(--accent);margin:5px 0;background:white}.job{margin-bottom:17px}.role{font-size:14px;font-weight:800}.company{font-size:13px;color:var(--accent);font-weight:bold}.meta{font-size:11px;color:#64748b}.desc{font-size:12px;line-height:1.55;margin-top:4px;white-space:pre-line}.editable{outline:1px solid transparent;outline-offset:4px;cursor:text}.editable:hover{outline:1px dashed #94a3b8}.selected{outline:2px solid #4f46e5!important;background:#4f46e50d}.box{border:1px solid #e2e8f0;padding:10px;border-radius:10px;margin-top:10px}.hint{font-size:12px;color:#64748b;line-height:1.5}@media(max-width:900px){.layout{grid-template-columns:1fr}.paper{transform:scale(.8);transform-origin:top center;margin-bottom:-220px}}
</style></head><body><div class="app"><div class="top"><h1>CareerPilot — CV Builder</h1><div><button class="secondary" id="save">Save</button> <button class="primary" id="pdf">Print / PDF</button></div></div><div class="layout"><div class="panel">
<div class="tabs"><button class="active" data-tab="content">Content</button><button data-tab="style">Selected Style</button><button data-tab="settings">Settings</button></div>
<div id="content"><label>Name</label><input id="name"><label>Professional Title</label><input id="title"><label>Email</label><input id="email"><label>Phone</label><input id="phone"><label>Location</label><input id="location"><label>Portfolio</label><input id="portfolio"><label>Professional Profile</label><textarea id="summary"></textarea><label>Skills</label><input id="skills" placeholder="Photoshop, Canva, Figma"><label>Languages</label><input id="languages"><label>Achievements</label><textarea id="achievements"></textarea><label>Certifications</label><textarea id="certifications"></textarea><label>Projects</label><textarea id="projects"></textarea><div id="expForm"></div><button class="secondary" id="addExp">+ Experience</button><div id="eduForm"></div><button class="secondary" id="addEdu">+ Education</button></div>
<div id="style" style="display:none"><div class="box" id="selectedInfo">Nothing selected</div><label>Selected Text Color</label><input type="color" id="textColor" value="#172033"><label>Font Size</label><input type="number" id="fontSize" min="8" max="72" value="16"><label>Font</label><select id="textFont"><option>Arial</option><option>Inter</option><option>Georgia</option><option>Times New Roman</option></select><div style="margin-top:10px"><button class="secondary" id="bold">Bold</button> <button class="secondary" id="left">Left</button> <button class="secondary" id="center">Center</button> <button class="secondary" id="right">Right</button> <button class="danger" id="reset">Reset</button></div><p class="hint">Only the selected element is changed.</p></div>
<div id="settings" style="display:none"><label>Template Accent</label><input type="color" id="accent" value="#334155"><p class="hint">Template Accent is separate from Selected Text Color.</p></div>
</div><div class="panel canvas"><div id="cv"></div></div></div></div>
<script>
const $=x=>document.getElementById(x),KEY='careerpilot_cv_rebuild_v1';
const S={d:{name:'',title:'',email:'',phone:'',location:'',portfolio:'',summary:'',skills:'',languages:'',achievements:'',certifications:'',projects:'',experiences:[],educations:[],accent:'#334155',styles:{}},selected:null};
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const eid=k=>'cv-'+String(k).replace(/[^a-zA-Z0-9_-]/g,'-');
function sa(id){const s=S.d.styles[id]||{};return (s.color?'color:'+s.color+'!important;':'')+(s.size?'font-size:'+s.size+'px!important;':'')+(s.font?'font-family:'+s.font+',Arial,sans-serif!important;':'')+(s.weight?'font-weight:'+s.weight+'!important;':'')+(s.align?'text-align:'+s.align+'!important;':'')+(s.x||s.y?'transform:translate('+Number(s.x||0)+'px,'+Number(s.y||0)+'px)!important;':'')}
function E(tag,k,html,cl=''){const id=eid(k);return '<'+tag+' id="'+id+'" data-eid="'+id+'" class="editable '+cl+'" contenteditable="true" spellcheck="false" style="'+sa(id)+'">'+html+'</'+tag+'>'}
function sec(k,t,v){if(!v)return '';return '<div class="sec">'+E('h2',k+'-heading',esc(t))+E('div',k,esc(v),'txt')+'</div>'}
function render(){
 const d=S.d,a=d.accent,skills=(d.skills||'').split(/[,\n]+/).map(x=>x.trim()).filter(Boolean).map((x,i)=>E('div','skill-'+i,esc(x),'skill')).join('');
 const ex=d.experiences.map((x,i)=>'<div class="job">'+E('div','exp-'+i+'-position',esc(x.position||'Position'),'role')+E('div','exp-'+i+'-company',esc(x.company||'Company'),'company')+E('div','exp-'+i+'-date',esc([x.start,x.end].filter(Boolean).join(' — ')),'meta')+E('div','exp-'+i+'-location',esc(x.location||''),'meta')+E('div','exp-'+i+'-description',esc(x.description||''),'desc')+'</div>').join('');
 const ed=d.educations.map((x,i)=>'<div class="job">'+E('div','edu-'+i+'-degree',esc(x.degree||'Qualification'),'role')+E('div','edu-'+i+'-school',esc(x.school||'Institute'),'company')+E('div','edu-'+i+'-year',esc(x.year||''),'meta')+E('div','edu-'+i+'-location',esc(x.location||''),'meta')+'</div>').join('');
 const side=sec('skills','Core Skills',skills)+sec('languages','Languages',d.languages)+sec('education','Education',ed)+sec('certifications','Certifications',d.certifications);
 const main=sec('summary','Professional Profile',d.summary)+sec('experience','Experience',ex)+sec('achievements','Key Achievements',d.achievements)+sec('projects','Selected Projects',d.projects);
 $('cv').innerHTML='<div class="paper" style="--accent:'+a+'"><div class="head">'+E('h1','name',esc(d.name||'Your Name'),'name')+E('div','title',esc(d.title||'Professional Title'),'title')+E('div','contact',esc([d.email,d.phone,d.location,d.portfolio].filter(Boolean).join(' • ')||'Email • Phone • City'),'contact')+'</div><div class="body"><aside class="side">'+side+'</aside><main class="main">'+main+'</main></div></div>';
 document.querySelectorAll('#cv [data-eid]').forEach(el=>{el.onclick=e=>{e.stopPropagation();select(el)};el.oninput=()=>sync(el)});applySelection();
}
function select(el){S.selected=el.dataset.eid;document.querySelectorAll('#cv .selected').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');const s=S.d.styles[S.selected]||{},c=getComputedStyle(el);$('selectedInfo').textContent='Selected: '+(el.innerText||'Element').trim().slice(0,35);$('textColor').value=s.color||rgb(c.color);$('fontSize').value=s.size||parseInt(c.fontSize)||16;$('textFont').value=s.font||'Arial'}
function rgb(x){const m=x.match(/\d+/g);return m?'#'+m.slice(0,3).map(v=>(+v).toString(16).padStart(2,'0')).join(''):'#172033'}
function applySelection(){if(!S.selected)return;const el=document.querySelector('#cv [data-eid="'+CSS.escape(S.selected)+'"]');if(el)select(el)}
function style(fn){if(!S.selected)return;S.d.styles[S.selected]={...(S.d.styles[S.selected]||{})};fn(S.d.styles[S.selected]);render();save(false)}
function sync(el){const id=el.dataset.eid,v=el.innerText.trim();if(id==='cv-name')S.d.name=v;else if(id==='cv-title')S.d.title=v;else if(id==='cv-contact'){const p=v.split('•').map(x=>x.trim());S.d.email=p[0]||'';S.d.phone=p[1]||'';S.d.location=p[2]||'';S.d.portfolio=p.slice(3).join(' • ')}else if(id.startsWith('cv-skill-'))S.d.skills=[...document.querySelectorAll('[id^="cv-skill-"]')].map(x=>x.innerText.trim()).filter(Boolean).join(', ');else if(/^cv-(summary|languages|achievements|certifications|projects)$/.test(id))S.d[id.slice(3)]=v;else{let m=id.match(/^cv-exp-(\d+)-(position|company|date|location|description)$/);if(m){let x=S.d.experiences[+m[1]]||{};if(m[2]==='date'){let p=v.split(' — ');x.start=p[0]||'';x.end=p[1]||''}else x[m[2]]=v;S.d.experiences[+m[1]]=x}else{m=id.match(/^cv-edu-(\d+)-(degree|school|year|location)$/);if(m){S.d.educations[+m[1]]||={};S.d.educations[+m[1]][m[2]]=v}}}save(false)}
function forms(){ $('expForm').innerHTML=S.d.experiences.map((x,i)=>'<div class="box"><b>Experience '+(i+1)+'</b>'+['company','position','start','end','location'].map(k=>'<label>'+k+'</label><input data-ex="'+i+'" data-k="'+k+'" value="'+esc(x[k]||'')+'">').join('')+'<label>description</label><textarea data-ex="'+i+'" data-k="description">'+esc(x.description||'')+'</textarea><button class="danger" data-rmexp="'+i+'">Remove</button></div>').join('');$('eduForm').innerHTML=S.d.educations.map((x,i)=>'<div class="box"><b>Education '+(i+1)+'</b>'+['degree','school','year','location'].map(k=>'<label>'+k+'</label><input data-edu="'+i+'" data-k="'+k+'" value="'+esc(x[k]||'')+'">').join('')+'<button class="danger" data-rmedu="'+i+'">Remove</button></div>').join('');document.querySelectorAll('[data-ex]').forEach(x=>x.oninput=()=>{S.d.experiences[+x.dataset.ex][x.dataset.k]=x.value;render()});document.querySelectorAll('[data-edu]').forEach(x=>x.oninput=()=>{S.d.educations[+x.dataset.edu][x.dataset.k]=x.value;render()});document.querySelectorAll('[data-rmexp]').forEach(x=>x.onclick=()=>{S.d.experiences.splice(+x.dataset.rmexp,1);forms();render()});document.querySelectorAll('[data-rmedu]').forEach(x=>x.onclick=()=>{S.d.educations.splice(+x.dataset.rmedu,1);forms();render()})}
function save(show=true){localStorage.setItem(KEY,JSON.stringify(S.d));if(show)alert('CV saved')}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x)Object.assign(S.d,x)}catch(e){}forms();render()}
['name','title','email','phone','location','portfolio','summary','skills','languages','achievements','certifications','projects'].forEach(id=>$(id).oninput=()=>{S.d[id]=$(id).value;render()});
$('accent').oninput=e=>{S.d.accent=e.target.value;render()};$('textColor').oninput=e=>style(s=>s.color=e.target.value);$('fontSize').oninput=e=>style(s=>s.size=Math.max(8,Math.min(72,+e.target.value)));$('textFont').onchange=e=>style(s=>s.font=e.target.value);$('bold').onclick=()=>style(s=>s.weight=s.weight==='800'?'400':'800');$('left').onclick=()=>style(s=>s.align='left');$('center').onclick=()=>style(s=>s.align='center');$('right').onclick=()=>style(s=>s.align='right');$('reset').onclick=()=>{if(S.selected){delete S.d.styles[S.selected];render();save(false)}};$('addExp').onclick=()=>{S.d.experiences.push({});forms();render()};$('addEdu').onclick=()=>{S.d.educations.push({});forms();render()};$('save').onclick=()=>save(true);$('pdf').onclick=()=>print();
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');['content','style','settings'].forEach(x=>$(x).style.display=x===b.dataset.tab?'block':'none')});load();
</script></body></html>
