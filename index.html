$('mnav').innerHTML=`<button data-v="cv"><i>✎</i><small>Edit</small></button><button data-action="preview"><i>◉</i><small>Preview</small></button><button data-v="design" data-design="1"><i>◈</i><small>Design</small></button><button data-v="design" data-templates="1"><i>▦</i><small>Templates</small></button><button data-action="export"><i>⇩</i><small>Export</small></button>`;
function go(v,opts={}){const from=document.body.dataset.v||'home';document.body.dataset.v=v;document.body.classList.remove('prev');Q('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+v));Q('#nav [data-v],#mnav [data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));if(v==='design'&&opts.designTab!==undefined){const tabs=Q('#v-design [data-dt]');const panels=Q('#v-design .dp');tabs.forEach((b,i)=>b.classList.toggle('on',i===opts.designTab));panels.forEach((p,i)=>p.classList.toggle('on',i===opts.designTab))}if(!opts.skipHistory&&from!==v){history.pushState({v},'',location.pathname+'#'+encodeURIComponent(v))}if(v==='jobs')maybeAutoCheckJobAlerts();requestAnimationFrame(fit)}
function prev(on,opts={}){const was=document.body.classList.contains('prev');document.body.classList.toggle('prev',on);if(!opts.skipHistory&&was!==on){history.pushState({v:document.body.dataset.v,prev:on},'',location.pathname+'#'+encodeURIComponent(document.body.dataset.v)+(on?'?preview=1':''))}requestAnimationFrame(fit)}
function restoreRoute(){const raw=location.hash.replace(/^#/,'');const v=decodeURIComponent(raw.split('?')[0]||'home');const valid=document.getElementById('v-'+v)?v:'home';const isPrev=new URLSearchParams(location.hash.split('?')[1]||'').get('preview')==='1';go(valid,{skipHistory:true});if(isPrev)prev(true,{skipHistory:true})}
window.addEventListener('popstate',restoreRoute);
window.addEventListener('hashchange',()=>restoreRoute());
document.addEventListener('click',e=>{const b=e.target.closest('[data-v],[data-soon],[data-action]');if(!b)return;if(b.dataset.soon)toast('Coming soon');else if(b.dataset.action==='preview')prev(true);else if(b.dataset.action==='export')exportPDF();else if(b.dataset.v==='design'&&b.dataset.templates)go('design',{designTab:0});else if(b.dataset.v==='design'&&b.dataset.design)go('design',{designTab:1});else go(b.dataset.v)});
$('bP').onclick=()=>prev(!document.body.classList.contains('prev'));$('fab').onclick=()=>prev(true);
$('bS').onclick=()=>{syncActiveLibrary();persist();scheduleCloudSave();toast('CV saved')};
function exportPDF(){
  const source=$('paper');
  if(!source){toast('CV preview is not ready');return}
  const w=window.open('','_blank','width=1100,height=850');
  if(!w){toast('Please allow pop-ups to export PDF');return}

  const styles=[...document.querySelectorAll('style')].map(s=>s.textContent).join('\n');
  const clone=source.cloneNode(true);

  // Keep the CV as real HTML text. Never convert it to canvas/image.
  Q('.el.sel',clone).forEach(x=>x.classList.remove('sel'));
  Q('.el:hover',clone).forEach(x=>x.classList.remove('hover'));
  Q('[contenteditable]',clone).forEach(x=>{
    x.removeAttribute('contenteditable');
    x.removeAttribute('spellcheck');
    x.removeAttribute('tabindex');
  });

  const printCss=`
    @page{size:A4;margin:0}
    *{
      -webkit-print-color-adjust:exact!important;
      print-color-adjust:exact!important;
      text-rendering:auto!important;
      filter:none!important;
      backdrop-filter:none!important;
      -webkit-backdrop-filter:none!important;
      mix-blend-mode:normal!important;
      perspective:none!important;
      will-change:auto!important;
    }
    html,body{
      margin:0!important;padding:0!important;
      width:210mm!important;min-height:297mm!important;
      background:#fff!important;color:#111827!important;
      -webkit-user-select:text!important;user-select:text!important;
    }
    body{display:block!important}
    .pdf-wrap{
      width:210mm!important;min-height:297mm!important;
      margin:0!important;padding:0!important;
      overflow:visible!important;background:#fff!important;
    }
    .pdf-wrap #paper{
      width:210mm!important;min-height:297mm!important;height:auto!important;
      margin:0!important;padding:0!important;
      transform:none!important;zoom:1!important;box-shadow:none!important;
      overflow:visible!important;position:relative!important;isolation:auto!important;
    }
    .pdf-wrap #paper,.pdf-wrap #paper *{
      -webkit-user-select:text!important;user-select:text!important;
    }
    .el{cursor:default!important;outline:none!important;caret-color:transparent!important}
    .it,section,.hd{break-inside:avoid!important;page-break-inside:avoid!important}
    @media print{html,body{width:210mm!important;background:#fff!important}.pdf-wrap{width:210mm!important}}
  `;

  w.document.open();
  w.document.write(
    '<!doctype html><html><head><meta charset="utf-8"><title>CareerPilot CV — '+
    esc(S.d.name||'CV')+
    '</title><style>'+styles+'\n'+printCss+
    '</style></head><body><div class="pdf-wrap">'+
    clone.outerHTML+
    '</div></body></html>
