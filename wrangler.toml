name = "careerpilot"
main = "worker.js"
compatibility_date = "2026-09-25"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*"]

[ai]
binding = "AI"

[[d1_databases]]
binding = "ALERTS_DB"
database_name = "careerpilot-alerts"
database_id = "f7f2766d-86b1-4e03-9119-44eae243ab38"

[triggers]
crons = ["0 * * * *"]
